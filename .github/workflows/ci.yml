name: CI Security & Quality Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Run unit & compliance tests
        run: npm test

      - name: Production Vite build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Static dangerous-sink & secret check
        run: |
          if grep -rnE "eval\(|new Function\(|document\.write|insertAdjacentHTML|AKIA[0-9A-Z]{16}|sk_live_|-----BEGIN [A-Z ]*PRIVATE KEY" src/ public/ index.html; then
            echo "Forbidden security pattern detected"
            exit 1
          fi
